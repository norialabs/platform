name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    name: PHP 8.5

    # The isolation tests need Postgres and a role that cannot ignore a policy.
    # Without both they skip, which passes while proving nothing.
    services:
      postgres:
        # Pinned to the major the runner's pg_dump speaks. pg_dump refuses a
        # server newer than itself, and the dump and restore tests shell out to
        # whatever is on PATH. Bump both together, never one alone.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql
          coverage: xdebug

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      # A mismatch here fails three tests a long way from the cause, so say so
      # up front rather than in a pg_dump stack trace.
      - name: Confirm the client can dump this server
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          CLIENT=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          SERVER=$(psql -h 127.0.0.1 -U postgres -tAc 'show server_version' | grep -oE '^[0-9]+')
          echo "pg_dump major $CLIENT against server major $SERVER"
          if [ "$CLIENT" -lt "$SERVER" ]; then
            echo "pg_dump $CLIENT cannot dump a server on $SERVER."
            echo "Pin the postgres service image back to $CLIENT, or install a newer client."
            exit 1
          fi

      # platform_test cannot bypass row level security, so the policies are
      # actually under test. platform_admin can, which is what the dump and
      # restore tests need to read a file back that is not empty.
      - name: Create the test roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -c "create role platform_test login password 'platform_test' nosuperuser nobypassrls"
          psql -h 127.0.0.1 -U postgres -c "create database platform_test owner platform_test"
          psql -h 127.0.0.1 -U postgres -c "create role platform_admin login password 'platform_admin' nosuperuser bypassrls createdb in role platform_test"
          psql -h 127.0.0.1 -U postgres -d platform_test -c "grant all on schema public to platform_test"

      - name: Run tests against Postgres
        env:
          NORIA_TEST_PG: pgsql://platform_test:platform_test@127.0.0.1:5432/platform_test
          NORIA_TEST_PG_ADMIN: pgsql://platform_admin:platform_admin@127.0.0.1:5432/platform_test
        run: ./vendor/bin/pest

      # Everything Postgres-only skips here. Run it anyway: a product on SQLite
      # should still get a suite that passes rather than one that errors.
      - name: Run tests on SQLite
        run: ./vendor/bin/pest

      - name: Verify package archive
        run: composer archive --format=zip --dir=/tmp

  verify:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Required checks passed
        run: echo "All required CI checks passed."

  tag:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      name: ${{ steps.tag.outputs.name }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version bump and create tag
        id: tag
        run: |
          set -euo pipefail

          # A re-run must not mint a second tag for a commit that already has one.
          EXISTING=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)

          if [ -n "$EXISTING" ]; then
            echo "HEAD is already tagged $EXISTING; reusing it."
            echo "name=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to hand out a version number that has already been used.
          #
          # A tag deleted from the repo does not un-publish the version. Packagist
          # keeps the first commit it saw for a version and rejects any later change,
          # which is how v0.1.12 ended up flagged "upstream re-tag blocked": it was
          # tagged at one commit, deleted, then recreated at another. Composer users
          # would have been served content that no branch contains.
          assert_version_unused() {
            TAG="$1"

            REMOTE_REF=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR==1 {print $1}')

            if [ -n "$REMOTE_REF" ]; then
              REMOTE_COMMIT=$(git rev-parse "${REMOTE_REF}^{commit}" 2>/dev/null || echo "$REMOTE_REF")

              if [ "$REMOTE_COMMIT" = "$(git rev-parse HEAD)" ]; then
                echo "Tag ${TAG} already exists upstream at this commit; reusing it."
                echo "name=${TAG}" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "Refusing to move ${TAG}."
              echo "  upstream: ${REMOTE_COMMIT}"
              echo "  HEAD:     $(git rev-parse HEAD)"
              echo "Moving a published tag desynchronises Packagist from the repo."
              exit 1
            fi

            # The tag may be gone while the version stays published.
            FEED=$(curl -fsS --max-time 15 \
              "https://repo.packagist.org/p2/norialabs/platform.json" || true)

            if [ -z "$FEED" ]; then
              echo "Could not reach Packagist to confirm ${TAG} is unused; continuing."
              return 0
            fi

            if printf '%s' "$FEED" | grep -q "\"version\":\"${TAG}\""; then
              echo "Refusing to create ${TAG}: Packagist already published that version."
              echo "The tag was deleted but the version was not, so recreating it here"
              echo "would serve different content under a version already in the wild."
              echo "Delete the version on Packagist first, or bump past it."
              exit 1
            fi
          }

          # The first public release for this package is v0.1.0. Ignore accidental
          # v0.0.x tags if they exist from earlier workflow attempts.
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev '^v0\.0\.' | head -n1 || true)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.1.0"
            echo "Latest release tag: none"
            echo "New tag: $NEW_TAG"

            assert_version_unused "$NEW_TAG"

            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "name=$NEW_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest release tag: $LATEST_TAG"

          # Parse current version
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "$MAJOR" -ne 0 ] || [ "$MINOR" -ne 1 ]; then
            echo "Refusing to auto-release outside v0.1.x. Move the release baseline manually when you are ready."
            exit 1
          fi

          PATCH=$((PATCH + 1))
          echo "Bump: patch"

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          assert_version_unused "$NEW_TAG"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "name=$NEW_TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [verify, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tag.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The tag name comes from the tag job. Re-deriving it here with
      # `git describe` raced the tag that job had just pushed, so this step used
      # to name the *previous* release and fail because it already existed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.tag.outputs.name }}
        run: |
          set -euo pipefail

          if [ -z "$TAG_NAME" ]; then
            echo "The tag job produced no tag name."
            exit 1
          fi

          # The push may not be visible to this job's remote immediately.
          for _ in $(seq 1 10); do
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $TAG_NAME"
          else
            gh release create "$TAG_NAME" --generate-notes
          fi

      - name: Update Packagist
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -XPOST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=thekiharani&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/norialabs/platform"}}'
